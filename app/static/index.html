<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Black Ant Workbench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&display=swap">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="shell">
  <aside class="rail" aria-label="Main">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <div><strong>Black Ant</strong><span>Workbench</span></div>
    </div>
    <nav>
      <p class="group">Mission</p>
      <a href="#/overview" data-route="overview">Overview</a>
      <p class="group">Work</p>
      <a href="#/experiments" data-route="experiments">Experiments</a>
      <a href="#/runs" data-route="runs">Runs</a>
      <p class="group">Evidence</p>
      <a href="#/validation" data-route="validation">Validation</a>
      <a href="#/moon" data-route="moon">Moon and baseline</a>
      <a href="#/compare" data-route="compare">Compare runs</a>
    </nav>
    <p class="railnote">Physics in <code>sim/</code>. This app starts the same runs you would type and reads what they save.</p>
  </aside>

  <div class="frame">
    <header class="topbar">
      <div class="crumbs" id="crumbs"></div>
      <button id="jobpill" class="jobpill" data-state="idle" hidden></button>
    </header>
    <main id="main" class="main" tabindex="-1"></main>
  </div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
